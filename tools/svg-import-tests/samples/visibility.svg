<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<rect x="10" y="10" width="180" height="180" fill="#f1f5f9" />
	<!-- `visibility="hidden"` must not be drawn -->
	<rect x="20" y="20" width="160" height="160" fill="#ef4444" visibility="hidden" />
	<!-- Neither a fill nor a stroke means nothing is drawn -->
	<path d="M 30,30 L 170,30 L 170,170 L 30,170 Z" stroke="none" fill="none" />
	<!-- Visibility inherited from a group -->
	<g visibility="hidden">
		<rect x="40" y="40" width="120" height="120" fill="#22c55e" />
	</g>
	<!-- Visibility re-enabled on a descendant of a hidden group -->
	<g visibility="hidden">
		<rect x="60" y="60" width="80" height="80" fill="#3b82f6" visibility="visible" />
	</g>
	<rect x="85" y="85" width="30" height="30" fill="#facc15" />
</svg>
